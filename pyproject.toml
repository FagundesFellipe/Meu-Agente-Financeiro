[project]
name = "meu-assistente-financeiro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.0",
    "langchain==1.3.14",
    "langchain-openai==1.1.7",
    "langchain-experimental==0.4.2",
    "langgraph==1.2.9",
    "langgraph-checkpoint-postgres==3.0.4",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]==0.40.0",
    "psycopg[binary,pool]==3.3.2",
    "pydantic-settings==2.12.0",
    "structlog==25.5.0",
    "ipython>=9.16.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "deepeval==4.1.7",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "langgraph-cli[inmem]==0.4.12",
    "langgraph-sdk==0.4.2",
    "pyright==1.1.408",
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "ruff==0.9.6",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
markers = [
    "db: testes que exigem um Postgres acessível em DATABASE_URL",
]

[tool.uv.workspace]
members = [
    "src/prompts_manager",
]
